<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>planner</title>
  <meta name="description" content="calendar + tasks" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1><a href="index.html">JB's blog</a></h1>
        <p class="tagline"></p>
      </div>
      <nav aria-label="Fő navigáció">
        <a class="navlink" href="index.html">entries</a>
        <a class="navlink" href="photos.html">photos</a>
        <a class="navlink" href="lists.html">lists</a>
        <a class="navlink" href="about.html">cv</a>
        <a class="navlink" href="planner.html" aria-current="page">planner</a>
      </nav>
    </header>

    <section class="card">
      <div class="meta">calendar + tasks</div>
    </section>

    <hr />

    <div class="planner-grid">
      <!-- CALENDAR -->
      <section>
        <div class="meta">google calendar</div>
        <div class="calwrap">
          <iframe
            src="https://calendar.google.com/calendar/embed?src=juhaszblnt%40gmail.com&ctz=Europe%2FBudapest"
            style="border:0"
            width="100%"
            height="720"
            frameborder="0"
            scrolling="no">
          </iframe>
        </div>
      </section>

      <!-- TASKS (TRELLO) -->
      <section>
        <div class="meta">tasks (trello)</div>

        <p class="muted">
          <a href="https://trello.com/b/2HJwHT1K/jbtasks" target="_blank" rel="noopener">open in trello</a>
        </p>

        <iframe
          src="https://trello.com/b/2HJwHT1K/jbtasks"
          style="border:0; width:100%; height:720px;"
          frameborder="0"
          scrolling="yes">
        </iframe>
      </section>
    </div>

    <footer>
      <div>© <span id="y"></span> JB · <span class="code">planner</span></div>
    </footer>
  </div>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
  </script>
</body>
</html>
